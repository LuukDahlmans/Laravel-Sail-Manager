name: Release

# Triggers:
#   - push to main: continuous release, auto-versioned per commit. Skips
#     docs / website / template-only changes so we don't burn macOS runner
#     minutes on commits that can't have changed the binary.
#   - push of a v* tag: draft release for curated, manually-published versions.
#   - manual dispatch from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'website/**'
      - 'docs/**'
      - 'static/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/website.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# A new push to main cancels any in-flight build for the same ref. Tag pushes
# get their own concurrency group so they're never cancelled by a main push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, notarize, and publish macOS bundle
    runs-on: macos-latest
    # Notarization can take 5-15 min, so we budget generously.
    timeout-minutes: 60

    # tauri-action needs write access to create the GitHub Release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so we can compute commit count for the
          # synthetic per-commit version.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Compute version + tag
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag push: use the tag verbatim. The maintainer is expected to
            # have bumped package.json / tauri.conf.json / Cargo.toml in the
            # commit being tagged, so we don't touch them here. Draft for
            # review.
            TAG="${GITHUB_REF#refs/tags/}"
            BUNDLE_VERSION="${TAG#v}"
            DRAFT="true"
            PRERELEASE="false"
            NAME="Sail Manager ${TAG}"
            BUMP="false"
          else
            # main push or manual dispatch: clean semver per commit. Patch
            # bumps with the total commit count, so tags like v0.1.42 are
            # always strictly greater than v0.1.41 and look like first-class
            # release versions to every consumer.
            MAJOR_MINOR=$(echo "${PKG_VERSION}" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
            COMMIT_COUNT=$(git rev-list --count HEAD)
            BUNDLE_VERSION="${MAJOR_MINOR}.${COMMIT_COUNT}"
            TAG="v${BUNDLE_VERSION}"
            DRAFT="false"
            PRERELEASE="false"
            NAME="Sail Manager ${TAG}"
            BUMP="true"
          fi
          {
            echo "tag=${TAG}"
            echo "bundle_version=${BUNDLE_VERSION}"
            echo "name=${NAME}"
            echo "draft=${DRAFT}"
            echo "prerelease=${PRERELEASE}"
            echo "bump=${BUMP}"
          } >> "${GITHUB_OUTPUT}"
          echo "Computed: tag=${TAG}, bundle_version=${BUNDLE_VERSION}, draft=${DRAFT}"

      - name: Patch source version (main / dispatch only)
        if: steps.version.outputs.bump == 'true'
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.bundle_version }}
        run: |
          # tauri.conf.json: this is what ends up in the .app's Info.plist and
          # in the DMG filename, so it must match the Release tag.
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.version = process.env.BUNDLE_VERSION;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          "
          # package.json: Tauri's CLI cross-checks this against tauri.conf.json
          # and Cargo.toml; if they diverge, the build fails.
          npm version "${BUNDLE_VERSION}" --no-git-tag-version --allow-same-version
          # Cargo.toml: only the [package] version is at column 0; dep
          # versions are nested inside braces so they don't match this anchor.
          sed -i.bak -E 's/^version = "[^"]*"/version = "'"${BUNDLE_VERSION}"'"/' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak
          echo "Patched in-source version to ${BUNDLE_VERSION}"

      - name: Install npm deps
        run: npm ci

      # Gate the release on the same checks CI runs. release.yml triggers on the
      # same push as ci.yml but is an independent workflow, so without this a
      # commit that merely COMPILES could publish (and auto-update every user)
      # with failing tests or lints. Fail here BEFORE signing/publishing.
      - name: Gate release on type-check, tests, and lints
        run: npm run check

      - name: Gate release on cargo test + clippy
        working-directory: src-tauri
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      # `tauri signer generate` writes a .key file whose CONTENTS are already
      # base64, and that string verbatim is what TAURI_SIGNING_PRIVATE_KEY
      # wants. Two things reliably go wrong when setting the secret:
      #   * running `base64 -i <keyfile>` first — wrapping an already-base64
      #     file a second time. Tauri then decodes one layer, finds more base64
      #     instead of a key, and dies with "Missing encoded key in secret key".
      #   * a trailing newline from the paste, which fails base64 decoding with
      #     "Invalid symbol 10, offset N" (10 is `\n`).
      # Both land AFTER code-signing and notarization have already run, wasting
      # the release. Normalize the value and verify it decodes to a real key
      # here, so a bad paste fails in seconds instead of ten minutes.
      - name: Normalize and verify updater signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi

          # Decoded key text pasted instead of the .key file? Encode it once.
          if printf '%s' "$RAW_KEY" | grep -q 'untrusted comment'; then
            KEY=$(printf '%s' "$RAW_KEY" | base64 | tr -d '[:space:]')
          else
            KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          fi

          is_key() { printf '%s' "$1" | base64 -d 2>/dev/null | head -c 17 | grep -q 'untrusted comment'; }

          # Peel one layer if there's a second base64 wrapper underneath.
          INNER=$(printf '%s' "$KEY" | base64 -d 2>/dev/null | tr -d '[:space:]' || true)
          if [ -n "$INNER" ] && is_key "$INNER"; then
            echo "Secret was double base64-encoded; using the inner value."
            KEY="$INNER"
          fi

          if ! is_key "$KEY"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not decode to a minisign secret key. Set it to the exact contents of your .key file: pbcopy < ~/.tauri/<name>.key"
            exit 1
          fi

          # Re-mask: GitHub only auto-masks the secret's exact original text, so
          # the normalized value would otherwise be printable in the log.
          echo "::add-mask::$KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "Updater signing key OK."

      - name: Build, sign, notarize, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple code-signing: tauri-action imports the cert into a temp
          # keychain, signs the .app with hardened runtime + entitlements,
          # then submits to Apple's notary service and staples the ticket.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing: signs the .app.tar.gz update payload so
          # the running app verifies it before installing. Key was generated
          # without a password, so TAURI_SIGNING_PRIVATE_KEY_PASSWORD is
          # omitted. TAURI_SIGNING_PRIVATE_KEY is NOT set here on purpose —
          # the normalize step above puts the cleaned value in GITHUB_ENV, and
          # a step-level `env:` entry would shadow it with the raw secret again.
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.name }}
          releaseDraft: ${{ steps.version.outputs.draft }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          releaseBody: 'See the assets to download and install this version.'
          args: --target universal-apple-darwin
