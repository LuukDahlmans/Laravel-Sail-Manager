name: Release

# Triggers:
#   - push to main: continuous prerelease, auto-versioned per commit. Skips
#     docs / website / template-only changes so we don't burn macOS runner
#     minutes on commits that can't have changed the binary.
#   - push of a v* tag: draft release for curated, manually-published versions.
#   - manual dispatch from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'website/**'
      - 'docs/**'
      - 'static/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/website.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# A new push to main cancels any in-flight build for the same ref. Tag pushes
# get their own concurrency group so they're never cancelled by a main push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS bundle
    runs-on: macos-latest
    timeout-minutes: 45

    # softprops/action-gh-release needs write access to releases.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so we can compute commit count for the
          # synthetic prerelease tag.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Compute version + tag
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag push: use the tag verbatim, draft release for review.
            TAG="${GITHUB_REF#refs/tags/}"
            DRAFT="true"
            PRERELEASE="false"
            NAME="Sail Manager ${TAG}"
          else
            # main push or manual dispatch: synthetic per-commit full release.
            COMMIT_COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="v${PKG_VERSION}-build.${COMMIT_COUNT}.${SHORT_SHA}"
            DRAFT="false"
            PRERELEASE="false"
            NAME="Sail Manager v${PKG_VERSION} (build ${COMMIT_COUNT})"
          fi
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "draft=${DRAFT}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "Computed: tag=${TAG}, draft=${DRAFT}, prerelease=${PRERELEASE}"

      - name: Install npm deps
        run: npm ci

      - name: Build universal binary
        # Code-signing + notarization env vars stay commented out until the
        # Apple Developer Program enrollment is complete and the secrets are
        # added to the repo. See RELEASE.md for the upgrade path.
        # env:
        #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          draft: ${{ steps.version.outputs.draft }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          # The .app.tar.gz updater bundle only exists once the Tauri updater
          # signing key is configured. Add it back to this glob list when
          # signing is wired up. Until then, ship the DMG only.
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
