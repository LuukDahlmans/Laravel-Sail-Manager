version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      tauri:
        patterns:
          - tauri*
      tokio:
        patterns:
          - tokio*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      sveltekit:
        patterns:
          - "svelte"
          - "@sveltejs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
