[package]
name = "sail-manager"
version = "0.1.0"
description = "Native macOS app for running many Laravel Sail projects in parallel"
authors = ["Luuk Dahlmans <luukvimonto@gmail.com>"]
license = "MIT"
repository = "https://github.com/LuukDahlmans/Laravel-Sail-Manager"
homepage = "https://github.com/LuukDahlmans/Laravel-Sail-Manager"
readme = "../README.md"
keywords = ["laravel", "sail", "docker", "tauri", "developer-tools"]
categories = ["development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt", "rt-multi-thread", "time"] }
portable-pty = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = "0.3"

